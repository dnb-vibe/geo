<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가까운 정비소 찾기</title>
<style>
  :root{--mint:#2ac1bc;--mint-soft:#e3f7f6;--ink:#1c2126;--ink-sub:#6b7480;
    --line:#eceef1;--bg:#f4f5f7;--danger:#e5484d;--naver:#03c75a;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#dfe2e6;color:var(--ink);}
  .frame{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;}
  .top{background:#fff;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:15px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px;}
  .top .bk{font-size:20px;color:#98a0aa;cursor:pointer;}
  .wrap{padding:20px 18px 40px;}
  h1.page{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px;}
  .lead{font-size:13.5px;color:var(--ink-sub);margin-bottom:16px;}

  /* 내 위치 정렬 버튼 */
  .locbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--mint-soft);color:#127c78;font-weight:800;font-size:14px;
    padding:13px;border:none;border-radius:12px;margin-bottom:14px;cursor:pointer;}
  .locbtn.on{background:var(--mint);color:#fff;}
  .locbtn .dot{width:9px;height:9px;border-radius:50%;background:currentColor;}
  .loc-note{font-size:12px;color:var(--ink-sub);margin:-6px 2px 14px;line-height:1.5;}

  /* 지역(권역) 필터 칩 */
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .chip{padding:9px 0;text-align:center;border-radius:20px;border:1.5px solid #dfe3e8;background:#fff;
    font-size:13.5px;font-weight:700;color:#5a626c;cursor:pointer;white-space:nowrap;}
  .chip.sel{border-color:var(--mint);background:var(--mint-soft);color:#127c78;font-weight:800;}

  .count{font-size:12.5px;color:var(--ink-sub);margin-bottom:10px;}
  .count b{color:var(--ink);}

  /* 정비소 카드 */
  .shop{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 15px 13px;margin-bottom:11px;}
  .r1{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .nm{font-size:16px;font-weight:800;}
  .km{margin-left:auto;background:var(--mint-soft);color:#127c78;font-weight:800;font-size:12px;
    padding:4px 9px;border-radius:20px;white-space:nowrap;}
  .rank{width:22px;height:22px;border-radius:7px;background:#2b3038;color:#fff;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .sign{display:inline-flex;align-items:center;gap:5px;background:#f2f4f6;color:#6b7480;
    border:1px solid #e6e9ed;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;margin-bottom:8px;}
  .sign b{font-weight:700;color:#4b535c;}
  .ad{font-size:12.5px;color:var(--ink-sub);line-height:1.45;margin-bottom:11px;}
  .btns{display:flex;gap:8px;}
  .btns a{flex:1;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    gap:6px;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer;}
  .btn-call{background:var(--mint);color:#fff;}
  .btn-map{background:#fff;color:#3d454e;border:1.5px solid #dfe3e8;}
  .nlogo{background:var(--naver);color:#fff;font-weight:900;font-size:12px;width:19px;height:19px;
    border-radius:5px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:-.5px;}
  .empty{text-align:center;color:var(--ink-sub);font-size:14px;padding:40px 0;line-height:1.6;}
</style></head>
<body>
<div class="frame">
  <div class="top"><span class="bk">‹</span> 가까운 정비소 찾기</div>
  <div class="wrap">
    <h1 class="page">가까운 정비소 찾기</h1>

    <button class="locbtn" id="locBtn"><span class="dot"></span> 내 위치 기준 가까운 순 보기</button>
    <div class="loc-note" id="locNote" style="display:none;"></div>

    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>
</div>

/* ▲▲▲  여기까지가 교체 대상 데이터  ▲▲▲ */

const REGION_ORDER = ['서울','경기','인천','경상','전라','충청']; // 강원 없음 // 칩 노출 순서(수도권 → 가나다)
const $ = s => document.querySelector(s);
let curRegion = '전체';
let myPos = null;

function distKm(a, b){
  const R=6371, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function fmtKm(km){ return km < 1 ? '약 '+Math.round(km*1000)+'m' : '약 '+km.toFixed(1)+'km'; }
function telHref(t){ return 'tel:' + String(t).replace(/[^0-9]/g,''); }
function mapHref(s){ return s.mapUrl || ('https://map.naver.com/p/search/' + encodeURIComponent(s.name + ' ' + s.addr)); }

function buildChips(){
  const present = REGION_ORDER.filter(rg => SHOPS.some(s=>s.region===rg));
  const regions = ['전체', ...present];
  const box = $('#chips'); box.innerHTML='';
  regions.forEach(rg=>{
    const c=document.createElement('div');
    c.className='chip'+(rg===curRegion?' sel':'');
    c.textContent=rg;
    c.onclick=()=>{ curRegion=rg; render(); };
    box.appendChild(c);
  });
}

function render(){
  buildChips();
  let list = SHOPS.filter(s => curRegion==='전체' || s.region===curRegion);
  if(myPos){
    list = list.map(s => ({...s, _km: distKm(myPos, s)})).sort((a,b)=> a._km - b._km);
  }
  $('#count').innerHTML = '총 <b>'+list.length+'곳</b>' + (myPos ? ' · 가까운 순' : '');

  const wrap = $('#list');
  if(!list.length){ wrap.innerHTML = '<div class="empty">해당 권역에 제휴 정비소가 없어요.<br>다른 지역을 선택해 주세요.</div>'; return; }

  wrap.innerHTML = list.map((s,i)=>`
    <div class="shop">
      <div class="r1">
        ${myPos ? `<span class="rank">${i+1}</span>` : ''}
        <span class="nm">${s.name}</span>
        ${myPos ? `<span class="km">${fmtKm(s._km)}</span>` : `<span class="km">${s.region}</span>`}
      </div>
      ${s.sign && !s.sign.includes('진바이크') ? `<div class="sign">${s.sign}</div>` : ''}
      <div class="ad">${s.addr}</div>
      <div class="btns">
        <a class="btn-call" href="${telHref(s.tel)}">📞 전화하기</a>
        <a class="btn-map" href="${mapHref(s)}" target="_blank" rel="noopener"><span class="nlogo">N</span> 지도</a>
      </div>
    </div>`).join('');
}

$('#locBtn').onclick = ()=>{
  const btn=$('#locBtn'), note=$('#locNote');
  if(!navigator.geolocation){
    note.style.display='block'; note.textContent='이 브라우저에서는 위치 기능을 쓸 수 없어요. 지역을 선택해 찾아 주세요.'; return;
  }
  btn.textContent='위치 확인 중…';
  navigator.geolocation.getCurrentPosition(
    pos=>{ myPos={lat:pos.coords.latitude, lng:pos.coords.longitude};
      btn.className='locbtn on'; btn.innerHTML='<span class="dot"></span> 내 위치 기준 정렬됨';
      note.style.display='none'; render(); },
    err=>{ btn.className='locbtn'; btn.innerHTML='<span class="dot"></span> 내 위치 기준 가까운 순 보기';
      note.style.display='block'; note.textContent='위치 권한이 꺼져 있어 가까운 순 정렬을 못 했어요. 지역을 선택해 찾아 주세요.'; },
    {enableHighAccuracy:true, timeout:8000}
  );
};

render();
</script>
